<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job approvals — Placement Cell</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="admin-jobs">
  <header id="appbar" class="appbar"></header>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Posting approvals</h1>
        <div class="sub">Review eligibility criteria before postings go live to students.</div>
      </div>
    </div>

    <div class="filters">
      <div class="row" id="tabs" style="gap:6px">
        <button class="btn sm" data-status="">All</button>
        <button class="btn sm" data-status="pending">Pending</button>
        <button class="btn sm" data-status="approved">Approved</button>
        <button class="btn sm" data-status="rejected">Rejected</button>
        <button class="btn sm" data-status="closed">Closed</button>
      </div>
      <input class="search" id="q" placeholder="Search title, company…">
      <button class="btn primary sm" id="refresh">Refresh</button>
    </div>

    <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Posting</th><th>Company</th><th>Eligibility</th><th>Deadline</th><th>Applicants</th><th>Status</th><th style="min-width:170px">Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <footer id="footer" class="footer"></footer>
  <script type="module">
    import { api, guard } from '/js/api.js';
    import { esc, badge, fmtDate, daysLeft, mountAppbar, mountFooter, toast, modal } from '/js/ui.js';

    const s = await guard('admin');
    if (!s) throw new Error('redirecting');
    mountAppbar(s, '/admin/jobs.html');
    mountFooter();

    let status = 'pending';
    const rows = document.getElementById('rows');
    const q = document.getElementById('q');

    function setActiveTab() {
      document.querySelectorAll('#tabs [data-status]').forEach((b) =>
        b.classList.toggle('primary', b.dataset.status === status));
    }

    async function load() {
      const data = await api('/api/admin/jobs', { query: { status, q: q.value.trim() } });
      if (!data.jobs.length) {
        rows.innerHTML = `<tr><td colspan="7"><div class="empty"><div class="big">✅</div>No ${status || ''} postings.</div></td></tr>`;
        return;
      }
      rows.innerHTML = data.jobs.map((j) => {
        const e = j.eligibility || {};
        const dl = daysLeft(j.deadline);
        return `<tr>
          <td><b>${esc(j.title)}</b><br><small class="muted">${esc(j.type)} · ${esc(j.location || '—')} · ${esc(String(j.openings ?? '—'))} openings</small></td>
          <td>${esc(j.companyName)}<br>${badge(j.companyStatus)}</td>
          <td class="small">CGPA ≥ <b>${esc(String(e.minCgpa ?? '—'))}</b> · Branches: ${esc((e.allowedBranches || []).join(', ') || 'any')}<br>
            <small class="muted">Years: ${esc((e.graduationYears || []).join(', ') || 'any')} · Backlogs ≤ ${esc(String(e.maxBacklogs ?? '—'))}</small></td>
          <td class="nowrap">${fmtDate(j.deadline)}${dl !== null && !j.deadlinePassed && j.status === 'approved' ? ` <small class="muted">(${dl}d)</small>` : ''}</td>
          <td>${j.applicantCount}</td>
          <td>${badge(j.status)}${j.decision ? `<br><small class="muted">by ${esc(j.decision.byName || '—')}</small>` : ''}</td>
          <td>
            <div class="row" style="gap:6px">
              <button class="btn sm" data-review="${esc(j.id)}">Review</button>
              ${j.status !== 'approved' ? `<button class="btn sm success" data-decide="${esc(j.id)}" data-decision="approve" ${j.companyStatus !== 'approved' ? 'disabled title="Approve the company first"' : ''}>Approve</button>` : ''}
              ${j.status !== 'rejected' ? `<button class="btn sm danger" data-decide="${esc(j.id)}" data-decision="reject">Reject</button>` : ''}
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    async function decide(id, decision, reason = '') {
      try {
        await api(`/api/admin/jobs/${encodeURIComponent(id)}/decision`, { method: 'POST', body: { decision, reason } });
        toast(`Posting ${decision === 'approve' ? 'approved — now visible to students' : 'rejected'} — action recorded in the audit log.`);
        await load();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    rows.addEventListener('click', async (e) => {
      const decideBtn = e.target.closest('[data-decide]');
      if (decideBtn) {
        let reason = '';
        if (decideBtn.dataset.decision === 'reject') {
          reason = prompt('Reason for rejection (required):') || '';
          if (!reason.trim()) return toast('Rejection requires a reason.', 'warn');
        }
        return decide(decideBtn.dataset.decide, decideBtn.dataset.decision, reason);
      }

      const reviewBtn = e.target.closest('[data-review]');
      if (reviewBtn) {
        const j = (await api('/api/admin/jobs')).jobs.find((x) => x.id === reviewBtn.dataset.review);
        const el = j.eligibility || {};
        modal({
          title: j.title,
          width: 660,
          body: `
            <div class="row mb">${badge(j.status)} <span class="muted small">${esc(j.companyName)} · ${esc(j.type)} · ${esc(j.location || '—')}</span></div>
            <p>${esc(j.description || '—')}</p>
            ${(j.responsibilities || []).length ? `<h3>Responsibilities</h3><ul style="margin:0 0 10px 18px">${j.responsibilities.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
            ${(j.skills || []).length ? `<div class="chips mb">${j.skills.map((x) => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
            <h3>Eligibility criteria</h3>
            <dl class="kv">
              <dt>Minimum CGPA</dt><dd>${esc(String(el.minCgpa ?? '—'))}</dd>
              <dt>Max backlogs</dt><dd>${esc(String(el.maxBacklogs ?? '—'))}</dd>
              <dt>Departments</dt><dd>${esc((el.allowedBranches || []).join(', ') || 'Any')}</dd>
              <dt>Graduation years</dt><dd>${esc((el.graduationYears || []).join(', ') || 'Any')}</dd>
              <dt>Deadline</dt><dd>${fmtDate(j.deadline)}</dd>
              <dt>Compensation</dt><dd>${esc(j.ctc || '—')}</dd>
            </dl>
            ${j.companyStatus !== 'approved' ? '<div class="banner warn mt" style="margin-bottom:0"><b>Company not approved yet</b>Approve the company before this posting.</div>' : ''}`,
          footer: `
            ${j.status !== 'approved' ? `<button class="btn success" data-modal-decide="${esc(j.id)}" data-decision="approve" ${j.companyStatus !== 'approved' ? 'disabled' : ''}>Approve posting</button>` : ''}
            ${j.status !== 'rejected' ? `<button class="btn danger" data-modal-decide="${esc(j.id)}" data-decision="reject">Reject posting</button>` : ''}
            <button class="btn" data-close>Close</button>`
        }).overlay.addEventListener('click', async (e) => {
          if (e.target.matches('[data-close]')) return e.target.closest('.modal-overlay').remove();
          const btn = e.target.closest('[data-modal-decide]');
          if (!btn) return;
          let reason = '';
          if (btn.dataset.decision === 'reject') {
            reason = prompt('Reason for rejection (required):') || '';
            if (!reason.trim()) return toast('Rejection requires a reason.', 'warn');
          }
          e.target.closest('.modal-overlay').remove();
          await decide(btn.dataset.modalDecide, btn.dataset.decision, reason);
        });
      }
    });

    document.getElementById('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-status]');
      if (!btn) return;
      status = btn.dataset.status;
      setActiveTab();
      load();
    });
    document.getElementById('refresh').addEventListener('click', load);
    q.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
    setActiveTab();
    await load();
  </script>
</body>
</html>
