<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Jobs — Student</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="student-jobs">
  <header id="appbar" class="appbar"></header>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Browse openings</h1>
        <div class="sub">Only placement-cell-approved postings are listed. Eligibility is evaluated live against your profile.</div>
      </div>
    </div>

    <div class="filters">
      <input class="search" id="q" placeholder="Search title, company, skill…">
      <select id="type">
        <option value="">All types</option>
        <option>Internship</option>
        <option>Full-time</option>
      </select>
      <label class="small" style="display:flex;align-items:center;gap:7px;font-weight:600">
        <input type="checkbox" id="eligibleOnly"> Only eligible for me
      </label>
      <button class="btn primary sm" id="applyFilters">Apply filters</button>
    </div>

    <div id="list" class="grid cols-2"></div>
    <div id="summary" class="muted small mt"></div>
  </main>
  <footer id="footer" class="footer"></footer>
  <script type="module">
    import { api, guard, param } from '/js/api.js';
    import { esc, badge, fmtDate, daysLeft, mountAppbar, mountFooter, toast, modal, errorMessage } from '/js/ui.js';

    const s = await guard('student');
    if (!s) throw new Error('redirecting');
    mountAppbar(s, '/student/jobs.html');
    mountFooter();

    const list = document.getElementById('list');
    const summary = document.getElementById('summary');
    const q = document.getElementById('q');
    const type = document.getElementById('type');
    const eligibleOnly = document.getElementById('eligibleOnly');
    if (param('eligible')) eligibleOnly.checked = true;

    let jobs = [];

    async function load() {
      list.innerHTML = '<div class="skeleton" style="grid-column:1/-1">Loading postings…</div>';
      const data = await api('/api/student/jobs', { query: { q: q.value.trim(), type: type.value, eligible: eligibleOnly.checked ? '1' : '' } });
      jobs = data.jobs;
      render();
    }

    function render() {
      summary.textContent = `${jobs.length} posting${jobs.length === 1 ? '' : 's'} shown`;
      if (!jobs.length) {
        list.innerHTML = '<div class="card" style="grid-column:1/-1"><div class="empty"><div class="big">🔍</div>No postings match your filters.</div></div>';
        return;
      }
      list.innerHTML = jobs.map((j) => {
        const dl = daysLeft(j.deadline);
        const dlText = j.deadlinePassed ? '<span class="badge b-red">Deadline passed</span>' : (dl !== null ? `<span class="badge ${dl <= 3 ? 'b-amber' : 'b-gray'}">${dl} day${dl === 1 ? '' : 's'} left</span>` : '');
        const appliedNote = j.applied
          ? `<span class="eligibility-note ok">Applied — ${esc(j.applicationStatus)}</span>`
          : j.eligibility.eligible
            ? '<span class="eligibility-note ok">You meet all criteria</span>'
            : `<span class="eligibility-note no">✗ ${esc(j.eligibility.checks.find((c) => !c.pass)?.label || 'Not eligible')}</span>`;
        return `
        <div class="card job-card" data-job="${esc(j.id)}">
          <div class="job-top">
            <div>
              <div class="job-title"><a href="/student/job.html?id=${esc(j.id)}">${esc(j.title)}</a></div>
              <small class="muted">${esc(j.companyName)} · ${esc(j.location || '—')}</small>
            </div>
            <div class="row" style="gap:6px">${badge(j.type)}${dlText}</div>
          </div>
          <div class="job-meta">
            <span>💼 ${esc(j.workMode)}</span><span>🎯 ${esc(String(j.eligibility.minCgpa ?? '—'))}+ CGPA</span>
            <span>🏛️ ${esc((j.eligibility.allowedBranches || []).join(', ') || 'All branches')}</span>
            <span>🗓️ Apply by ${fmtDate(j.deadline)}</span>
          </div>
          ${j.skills && j.skills.length ? `<div class="chips">${j.skills.slice(0, 5).map((sk) => `<span class="chip">${esc(sk)}</span>`).join('')}</div>` : ''}
          <div class="job-foot">
            ${appliedNote}
            <div class="row" style="gap:8px">
              <a class="btn sm" href="/student/job.html?id=${esc(j.id)}">Details</a>
              ${j.applied
                ? `<a class="btn sm" href="/student/application.html?id=${esc(j.applicationId)}">Track</a>`
                : `<button class="btn primary sm" data-apply="${esc(j.id)}">Apply</button>`}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    list.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-apply]');
      if (!btn) return;
      btn.disabled = true;
      try {
        await api('/api/student/applications', { method: 'POST', body: { jobId: btn.dataset.apply } });
        toast('Application submitted! Track it under My Applications.');
        await load();
      } catch (err) {
        btn.disabled = false;
        if (err.status === 403 && err.data && err.data.checks) {
          showBlockModal(err.data.checks);
        } else {
          toast(errorMessage(err), 'error');
        }
      }
    });

    function showBlockModal(checks) {
      modal({
        title: 'Application blocked',
        width: 560,
        body: `<div class="banner danger" style="margin-bottom:12px"><b>You do not meet the eligibility criteria for this posting.</b>
                 The server rejected this submission. Details below:</div>
          <ul class="check-list">
            ${checks.map((c) => `
              <li>
                <span class="ico ${c.pass ? 'pass' : 'fail'}">${c.pass ? '✓' : '✗'}</span>
                <span><b>${esc(c.label)}</b>
                  <span class="why">Required: ${esc(String(c.required))} · You: ${esc(String(c.actual))}</span>
                  ${c.hint ? `<span class="why">${esc(c.hint)}</span>` : ''}
                </span>
              </li>`).join('')}
          </ul>`,
        footer: '<button class="btn primary" data-close>Got it</button>'
      }).overlay.querySelector('[data-close]').addEventListener('click', (e) => e.target.closest('.modal-overlay').remove());
    }

    document.getElementById('applyFilters').addEventListener('click', load);
    q.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
    eligibleOnly.addEventListener('change', load);
    await load();
  </script>
</body>
</html>
